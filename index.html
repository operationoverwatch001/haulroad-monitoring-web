<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Haul Road - Overwatch</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Library Excel, Chart, Datalabels, Leaflet, & jsPDF/html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ========================================== */
    /* INTRO SPLASH SCREEN & CYBER GLITCH STYLES  */
    /* ========================================== */
    #intro-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #040508;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-logo-container {
      position: relative;
      width: 150px;
      height: 150px;
      animation: logoPulse 2s infinite ease-in-out;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(184, 20, 50, 0.8));
    }

    .glitch-title {
      position: relative;
      color: #ffffff;
      font-family: monospace, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      margin-top: 24px;
      font-size: 1.15rem;
      text-align: center;
      text-transform: uppercase;
    }

    .glitch-title span {
      color: #b81432;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #040508;
    }

    .glitch-title::before {
      left: 2px;
      text-shadow: -2px 0 #ff0033;
      clip: rect(24px, 550px, 90px, 0);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .glitch-title::after {
      left: -2px;
      text-shadow: -2px 0 #00ffff;
      clip: rect(85px, 550px, 140px, 0);
      animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
    }

    /* Efek Buyar Pecah (Brutal Outro) KHUSUS untuk Teks Title */
    .glitch-title.glitch-outro {
      animation: brutalTextScatter 0.4s cubic-bezier(0.11, 0, 0.5, 1) forwards !important;
    }
    .glitch-title.glitch-outro::before {
      animation: glitch-anim-1 0.04s infinite linear !important;
    }
    .glitch-title.glitch-outro::after {
      animation: glitch-anim-2 0.04s infinite linear !important;
    }

    .loading-track {
      width: 200px;
      height: 4px;
      background: #121824;
      margin-top: 20px;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    #loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #b81432, #ff2b54);
      transition: width 1.0s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .loading-status {
      color: #64748b;
      font-family: monospace;
      font-size: 0.7rem;
      margin-top: 12px;
      letter-spacing: 3px;
    }

    @keyframes logoPulse {
      0% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 35px rgba(184, 20, 50, 0.95)); }
      100% { transform: scale(0.96); opacity: 0.85; }
    }

    @keyframes brutalTextScatter {
      0% { transform: scale(1) translate(0, 0); filter: blur(0px); opacity: 1; clip-path: inset(0 0 0 0); }
      25% { transform: scale(1.05) translate(8px, -5px) skew(30deg); color: #ff0033; clip-path: inset(30% 0 20% 0); letter-spacing: 8px; }
      50% { transform: scale(0.95) translate(-12px, 8px) skew(-45deg); color: #00ffff; clip-path: inset(0 40% 40% 0); letter-spacing: 2px; filter: blur(2px); }
      75% { transform: scale(1.1) translate(20px, -15px) skew(60deg); color: #ffff00; clip-path: inset(60% 0 10% 30%); letter-spacing: 20px; filter: blur(5px); opacity: 0.6; }
      100% { transform: scale(0.5) translate(-30px, 30px) skew(-90deg); filter: blur(12px); opacity: 0; letter-spacing: 40px; clip-path: inset(50% 50% 50% 50%); }
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(15px, 9999px, 40px, 0); }
      20% { clip: rect(60px, 9999px, 85px, 0); }
      40% { clip: rect(10px, 9999px, 55px, 0); }
      60% { clip: rect(75px, 9999px, 95px, 0); }
      80% { clip: rect(30px, 9999px, 65px, 0); }
      100% { clip: rect(50px, 9999px, 80px, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(50px, 9999px, 80px, 0); }
      20% { clip: rect(20px, 9999px, 60px, 0); }
      40% { clip: rect(70px, 9999px, 90px, 0); }
      60% { clip: rect(5px, 9999px, 35px, 0); }
      80% { clip: rect(90px, 9999px, 110px, 0); }
      100% { clip: rect(40px, 9999px, 70px, 0); }
    }

    /* ========================================== */
    /* HEADER KUNCI: DEEP NAVY SOLID              */
    /* ========================================== */
    .app-header {
      background-color: #0f172a !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo-img {
      height: 38px;
      width: 38px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. INTRO SPLASH SCREEN (3.8 DETIK)         -->
  <!-- ========================================== -->
  <div id="intro-splash">
    <div class="splash-logo-container">
      <img src="data/logo_overwatch.png" alt="Operation Overwatch" class="splash-logo">
    </div>
    <h2 class="glitch-title" data-text="OPERATION OVERWATCH">OPERATION <span>OVERWATCH</span></h2>
    <div class="loading-track">
      <div id="loading-bar"></div>
    </div>
    <div class="loading-status" id="status-text">INITIALIZING SECURE LINK...</div>
  </div>

  <!-- ========================================== -->
  <!-- 2. HEADER UTAMA APLIKASI                   -->
  <!-- ========================================== -->
  <header class="app-header">
    <div class="brand">
      <img src="data/logo_overwatch.png" alt="Logo" class="header-logo-img">
      <span>OVERWATCH ROAD INSPECTOR</span>
    </div>
    <nav class="tab-container">
      <button class="tab-btn active" onclick="switchTab('grade')">Grade</button>
      <button class="tab-btn" onclick="switchTab('lebar')">Lebar</button>
      <button class="tab-btn" onclick="switchTab('crossfall')">Crossfall</button>
    </nav>
  </header>

  <!-- ========================================== -->
  <!-- 3. PETA & TOMBOL GPS                       -->
  <!-- ========================================== -->
  <div id="map"></div>
  <button class="gps-btn" onclick="locateUser()" title="Posisi Saya">📍</button>

  <!-- ========================================== -->
  <!-- 4. PANEL BAWAH (BOTTOM SHEET)              -->
  <!-- ========================================== -->
  <div id="bottom-panel" class="bottom-panel">
    <div class="panel-header">
      <div class="drag-handle"></div>
      <div class="panel-title" id="panel-title">Pilih Parameter / STA</div>
    </div>
    <div class="panel-body" id="panel-body">
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL PILIHAN EXPORT PDF                   -->
  <!-- ========================================== -->
  <div id="pdfModalOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:99999; justify-content:center; align-items:center;">
    <div style="background:#0f172a; color:#fff; padding:20px; border-radius:8px; width:90%; max-width:350px; border:1px solid #1e293b; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
      <h3 style="margin-top:0; font-size:14px; color:#ff2b54; letter-spacing:1px; font-family:monospace;">EXPORT GRAFIK KE PDF</h3>
      <p style="font-size:11px; color:#94a3b8; margin-bottom:15px;">Pilih format layout cetak grafik memanjang:</p>
      
      <label style="display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:10px; cursor:pointer;">
        <input type="radio" name="pdfExportOpt" value="single" checked style="accent-color:#b81432;">
        <span><b>Opsi 1:</b> Utuh 1 Lembar (Landscape Panjang)</span>
      </label>
      
      <label style="display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:20px; cursor:pointer;">
        <input type="radio" name="pdfExportOpt" value="paging" style="accent-color:#b81432;">
        <span><b>Opsi 2:</b> Dipecah Per Section (Multi-Page Renggang)</span>
      </label>
      
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closePdfModal()" style="background:#1e293b; color:#cbd5e1; border:none; padding:6px 12px; border-radius:4px; font-size:11px; cursor:pointer;">Batal</button>
        <button onclick="executeExportPDF()" style="background:#b81432; color:#fff; border:none; padding:6px 14px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer;">Download</button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 5. SCRIPT KONTROL ANIMASI INTRO (3.8 DETIK) -->
  <!-- ========================================== -->
  <script>
    window.addEventListener('load', () => {
      const bar = document.getElementById('loading-bar');
      const splash = document.getElementById('intro-splash');
      const statusText = document.getElementById('status-text');
      const titleElement = document.querySelector('.glitch-title');

      setTimeout(() => {
        bar.style.width = '45%';
        statusText.innerText = 'LOADING SPATIAL MESH...';
      }, 700);

      setTimeout(() => {
        bar.style.width = '85%';
        statusText.innerText = 'SYNCHRONIZING TELEMETRY...';
      }, 2000);

      setTimeout(() => {
        bar.style.width = '100%';
        statusText.innerText = 'SYSTEM READY.';
        if (titleElement) titleElement.classList.add('glitch-outro');
      }, 3100);

      setTimeout(() => {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
        }, 700);
      }, 3800); // Total pas 3.8 detik
    });
  </script>

  <!-- Script utama lu -->
  <script src="app.js"></script>
</body>
</html>
