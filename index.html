<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Haul Road - Overwatch</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Library Excel, Chart, Datalabels, & Leaflet -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* ========================================== */
    /* INTRO SPLASH SCREEN & CYBER GLITCH STYLES  */
    /* ========================================== */
    #intro-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #040508;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-logo-container {
      position: relative;
      width: 150px;
      height: 150px;
      animation: logoPulse 2s infinite ease-in-out;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(184, 20, 50, 0.8));
    }

    .glitch-title {
      position: relative;
      color: #ffffff;
      font-family: monospace, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      margin-top: 24px;
      font-size: 1.15rem;
      text-align: center;
      text-transform: uppercase;
    }

    .glitch-title span {
      color: #b81432;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #040508;
    }

    .glitch-title::before {
      left: 2px;
      text-shadow: -2px 0 #ff0033;
      clip: rect(24px, 550px, 90px, 0);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .glitch-title::after {
      left: -2px;
      text-shadow: -2px 0 #00ffff;
      clip: rect(85px, 550px, 140px, 0);
      animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
    }

    .loading-track {
      width: 200px;
      height: 4px;
      background: #121824;
      margin-top: 20px;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    #loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #b81432, #ff2b54);
      transition: width 1.4s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .loading-status {
      color: #64748b;
      font-family: monospace;
      font-size: 0.7rem;
      margin-top: 12px;
      letter-spacing: 3px;
    }

    @keyframes logoPulse {
      0% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 35px rgba(184, 20, 50, 0.95)); }
      100% { transform: scale(0.96); opacity: 0.85; }
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(15px, 9999px, 40px, 0); }
      20% { clip: rect(60px, 9999px, 85px, 0); }
      40% { clip: rect(10px, 9999px, 55px, 0); }
      60% { clip: rect(75px, 9999px, 95px, 0); }
      80% { clip: rect(30px, 9999px, 65px, 0); }
      100% { clip: rect(50px, 9999px, 80px, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(50px, 9999px, 80px, 0); }
      20% { clip: rect(20px, 9999px, 60px, 0); }
      40% { clip: rect(70px, 9999px, 90px, 0); }
      60% { clip: rect(5px, 9999px, 35px, 0); }
      80% { clip: rect(90px, 9999px, 110px, 0); }
      100% { clip: rect(40px, 9999px, 70px, 0); }
    }

    /* ========================================== */
    /* STYLING HEADER & UI CUSTOMIZER BUTTON      */
    /* ========================================== */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.3s ease, backdrop-filter 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo-img {
      height: 38px;
      width: 38px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Tombol Setting UI ala Game */
    .ui-config-btn {
      background: rgba(184, 20, 50, 0.2);
      border: 1px solid #b81432;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
      margin-left: 8px;
    }
    .ui-config-btn:active {
      transform: scale(0.95);
      background: rgba(184, 20, 50, 0.5);
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. INTRO SPLASH SCREEN                     -->
  <!-- ========================================== -->
  <div id="intro-splash">
    <div class="splash-logo-container">
      <img src="data/logo_overwatch.png" alt="Operation Overwatch" class="splash-logo">
    </div>
    <h2 class="glitch-title" data-text="OPERATION OVERWATCH">OPERATION <span>OVERWATCH</span></h2>
    <div class="loading-track">
      <div id="loading-bar"></div>
    </div>
    <div class="loading-status" id="status-text">INITIALIZING SECURE LINK...</div>
  </div>

  <!-- ========================================== -->
  <!-- 2. HEADER UTAMA APLIKASI                   -->
  <!-- ========================================== -->
  <header class="app-header">
    <div class="brand">
      <img src="data/logo_overwatch.png" alt="Logo" class="header-logo-img">
      <span>OVERWATCH ROAD INSPECTOR</span>
    </div>
    
    <div style="display: flex; align-items: center;">
      <nav class="tab-container">
        <button class="tab-btn active" onclick="switchTab('grade')">Grade</button>
        <button class="tab-btn" onclick="switchTab('lebar')">Lebar</button>
        <button class="tab-btn" onclick="switchTab('crossfall')">Crossfall</button>
      </nav>
      <!-- Tombol Setting UI -->
      <button class="ui-config-btn" onclick="toggleThemeMenu()" title="Pengaturan Tampilan UI">⚙️ UI</button>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- 3. PETA & PANEL UTAMA                      -->
  <!-- ========================================== -->
  <div id="map"></div>

  <button class="gps-btn" onclick="locateUser()" title="Posisi Saya">📍</button>

  <div id="bottom-panel" class="bottom-panel">
    <div class="panel-header">
      <div class="drag-handle"></div>
      <div class="panel-title" id="panel-title">Pilih Parameter / STA</div>
    </div>
    <div class="panel-body" id="panel-body">
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 4. MODAL SETTING UI (TACTICAL GAME MENU)   -->
  <!-- ========================================== -->
  <div id="ui-config-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px); z-index: 999999; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;">
    <div style="background: #0b131f; border: 1.5px solid #b81432; width: 100%; max-width: 340px; padding: 22px; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.9); font-family: monospace; color: #fff;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 18px;">
        <span style="font-weight: bold; letter-spacing: 2px; color: #b81432; font-size: 0.9rem;">[ TACTICAL UI CONFIG ]</span>
        <button onclick="toggleThemeMenu()" style="background: #1e293b; border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; font-weight: bold;">✕</button>
      </div>

      <!-- Color Picker -->
      <div style="margin-bottom: 18px;">
        <label style="font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 6px; letter-spacing: 1px;">HEADER TONE (WARNA DASAR)</label>
        <input type="color" id="cfg-color" value="#0f172a" onchange="applyUIConfig()" style="width: 100%; height: 42px; border: 1px solid #334155; border-radius: 6px; background: #040508; cursor: pointer; padding: 2px;">
      </div>

      <!-- Opacity Slider -->
      <div style="margin-bottom: 18px;">
        <label style="font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 6px; letter-spacing: 1px;">
          <span>TRANSPARANSI</span>
          <span id="val-opacity" style="color: #b81432; font-weight: bold;">100%</span>
        </label>
        <input type="range" id="cfg-opacity" min="0.4" max="1" step="0.05" value="1" oninput="applyUIConfig()" style="width: 100%; cursor: pointer; accent-color: #b81432;">
      </div>

      <!-- Background Blur Slider -->
      <div style="margin-bottom: 22px;">
        <label style="font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 6px; letter-spacing: 1px;">
          <span>BLUR / GLASS EFFECT</span>
          <span id="val-blur" style="color: #b81432; font-weight: bold;">0px</span>
        </label>
        <input type="range" id="cfg-blur" min="0" max="20" step="1" value="0" oninput="applyUIConfig()" style="width: 100%; cursor: pointer; accent-color: #b81432;">
      </div>

      <!-- Reset Button -->
      <button onclick="resetUIConfig()" style="width: 100%; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; letter-spacing: 2px; font-weight: bold; transition: background 0.2s;">RESET DEFAULT</button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 5. SCRIPT KONTROL ANIMASI & UI SETTING     -->
  <!-- ========================================== -->
  <script>
    // Intro Splash Screen Logic
    window.addEventListener('load', () => {
      const bar = document.getElementById('loading-bar');
      const splash = document.getElementById('intro-splash');
      const statusText = document.getElementById('status-text');

      setTimeout(() => {
        bar.style.width = '75%';
        statusText.innerText = 'LOADING SPATIAL MESH...';
      }, 250);

      setTimeout(() => {
        bar.style.width = '100%';
        statusText.innerText = 'SYSTEM READY.';
      }, 1200);

      setTimeout(() => {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
        }, 800);
      }, 1800);

      // Load Saved UI Config on Startup
      loadSavedUIConfig();
    });

    // Toggle Modal Menu Setting UI
    function toggleThemeMenu() {
      const modal = document.getElementById('ui-config-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    // Apply UI Changes Live & Save to LocalStorage
    function applyUIConfig() {
      const color = document.getElementById('cfg-color').value;
      const opacity = document.getElementById('cfg-opacity').value;
      const blur = document.getElementById('cfg-blur').value;

      document.getElementById('val-opacity').innerText = Math.round(opacity * 100) + '%';
      document.getElementById('val-blur').innerText = blur + 'px';

      const header = document.querySelector('.app-header');
      if (header) {
        let r = parseInt(color.slice(1,3), 16);
        let g = parseInt(color.slice(3,5), 16);
        let b = parseInt(color.slice(5,7), 16);
        
        header.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${opacity})`;
        header.style.backdropFilter = `blur(${blur}px)`;
        header.style.webkitBackdropFilter = `blur(${blur}px)`;
      }

      localStorage.setItem('overwatch_ui', JSON.stringify({ color, opacity, blur }));
    }

    // Reset Configuration
    function resetUIConfig() {
      localStorage.removeItem('overwatch_ui');
      document.getElementById('cfg-color').value = '#0f172a';
      document.getElementById('cfg-opacity').value = 1;
      document.getElementById('cfg-blur').value = 0;
      applyUIConfig();
    }

    // Load Config Function
    function loadSavedUIConfig() {
      const saved = localStorage.getItem('overwatch_ui');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          document.getElementById('cfg-color').value = data.color || '#0f172a';
          document.getElementById('cfg-opacity').value = data.opacity || 1;
          document.getElementById('cfg-blur').value = data.blur || 0;
          applyUIConfig();
        } catch(e) { console.error(e); }
      }
    }
  </script>

  <!-- Script utama lu -->
  <script src="app.js"></script>
</body>
</html>
