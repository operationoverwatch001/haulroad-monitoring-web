<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Haul Road - Overwatch</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Library Excel, Chart, Datalabels, & Leaflet -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* ========================================== */
    /* INTRO SPLASH SCREEN & CYBER GLITCH STYLES  */
    /* ========================================== */
    #intro-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #040508;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-logo-container {
      position: relative;
      width: 150px;
      height: 150px;
      animation: logoPulse 2s infinite ease-in-out;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(184, 20, 50, 0.8));
    }

    .glitch-title {
      position: relative;
      color: #ffffff;
      font-family: monospace, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      margin-top: 24px;
      font-size: 1.15rem;
      text-align: center;
      text-transform: uppercase;
    }

    .glitch-title span {
      color: #b81432;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #040508;
    }

    .glitch-title::before {
      left: 2px;
      text-shadow: -2px 0 #ff0033;
      clip: rect(24px, 550px, 90px, 0);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .glitch-title::after {
      left: -2px;
      text-shadow: -2px 0 #00ffff;
      clip: rect(85px, 550px, 140px, 0);
      animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
    }

    .loading-track {
      width: 200px;
      height: 4px;
      background: #121824;
      margin-top: 20px;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    #loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #b81432, #ff2b54);
      transition: width 1.4s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .loading-status {
      color: #64748b;
      font-family: monospace;
      font-size: 0.7rem;
      margin-top: 12px;
      letter-spacing: 3px;
    }

    @keyframes logoPulse {
      0% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 35px rgba(184, 20, 50, 0.95)); }
      100% { transform: scale(0.96); opacity: 0.85; }
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(15px, 9999px, 40px, 0); }
      20% { clip: rect(60px, 9999px, 85px, 0); }
      40% { clip: rect(10px, 9999px, 55px, 0); }
      60% { clip: rect(75px, 9999px, 95px, 0); }
      80% { clip: rect(30px, 9999px, 65px, 0); }
      100% { clip: rect(50px, 9999px, 80px, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(50px, 9999px, 80px, 0); }
      20% { clip: rect(20px, 9999px, 60px, 0); }
      40% { clip: rect(70px, 9999px, 90px, 0); }
      60% { clip: rect(5px, 9999px, 35px, 0); }
      80% { clip: rect(90px, 9999px, 110px, 0); }
      100% { clip: rect(40px, 9999px, 70px, 0); }
    }

    /* ========================================== */
    /* HEADER KUNCI: DEEP NAVY SOLID              */
    /* ========================================== */
    .app-header {
      background-color: #0f172a !important; /* Warna Deep Navy dikunci */
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo-img {
      height: 38px;
      width: 38px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. INTRO SPLASH SCREEN                     -->
  <!-- ========================================== -->
  <div id="intro-splash">
    <div class="splash-logo-container">
      <img src="data/logo_overwatch.png" alt="Operation Overwatch" class="splash-logo">
    </div>
    <h2 class="glitch-title" data-text="OPERATION OVERWATCH">OPERATION <span>OVERWATCH</span></h2>
    <div class="loading-track">
      <div id="loading-bar"></div>
    </div>
    <div class="loading-status" id="status-text">INITIALIZING SECURE LINK...</div>
  </div>

  <!-- ========================================== -->
  <!-- 2. HEADER UTAMA APLIKASI                   -->
  <!-- ========================================== -->
  <header class="app-header">
    <div class="brand">
      <img src="data/logo_overwatch.png" alt="Logo" class="header-logo-img">
      <span>OVERWATCH ROAD INSPECTOR</span>
    </div>
    <nav class="tab-container">
      <button class="tab-btn active" onclick="switchTab('grade')">Grade</button>
      <button class="tab-btn" onclick="switchTab('lebar')">Lebar</button>
      <button class="tab-btn" onclick="switchTab('crossfall')">Crossfall</button>
    </nav>
  </header>

  <!-- ========================================== -->
  <!-- 3. PETA & PANEL UTAMA                      -->
  <!-- ========================================== -->
  <div id="map"></div>

  <button class="gps-btn" onclick="locateUser()" title="Posisi Saya">📍</button>

  <div id="bottom-panel" class="bottom-panel">
    <div class="panel-header">
      <div class="drag-handle"></div>
      <div class="panel-title" id="panel-title">Pilih Parameter / STA</div>
    </div>
    <div class="panel-body" id="panel-body">
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 4. SCRIPT KONTROL ANIMASI INTRO            -->
  <!-- ========================================== -->
  <script>
    window.addEventListener('load', () => {
      const bar = document.getElementById('loading-bar');
      const splash = document.getElementById('intro-splash');
      const statusText = document.getElementById('status-text');

      setTimeout(() => {
        bar.style.width = '75%';
        statusText.innerText = 'LOADING SPATIAL MESH...';
      }, 250);

      setTimeout(() => {
        bar.style.width = '100%';
        statusText.innerText = 'SYSTEM READY.';
      }, 1200);

      setTimeout(() => {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
        }, 800);
      }, 1800);
    });
  </script>

  <!-- Script utama lu -->
  <script src="app.js"></script>
</body>
</html>
