<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Haul Road - Overwatch</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Library Excel, Chart, Datalabels, & Leaflet -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="brand">OVERWATCH ROAD INSPECTOR</div>
    <nav class="tab-container">
      <button class="tab-btn active" onclick="switchTab('grade')">Grade Jalan</button>
      <button class="tab-btn" onclick="switchTab('lebar')">Lebar Jalan</button>
      <button class="tab-btn" onclick="switchTab('crossfall')">Crossfall</button>
    </nav>
  </header>

  <div id="map"></div>

  <button class="gps-btn" onclick="locateUser()" title="Posisi Saya">📍</button>

  <div id="bottom-panel" class="bottom-panel">
    <div class="panel-header">
      <div class="drag-handle"></div>
      <div class="panel-title" id="panel-title">Pilih Parameter / STA</div>
    </div>
    <div class="panel-body" id="panel-body">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
