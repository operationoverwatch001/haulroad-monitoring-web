<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Haul Road - Overwatch</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Library Excel, Chart, Leaflet, jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Engine PMTiles untuk Citra Drone Cloud-Optimized (v3 Stable) -->
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* RESET & DASAR */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #040508;
      position: relative;
    }

    /* PETA LEAFLET (HARUS MENGISI LAYER BELAKANG PENUH) */
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #040508;
    }

    /* TOMBOL TOGGLE BASEMAP SATELIT (MELAYANG DI ATAS PETA) */
    #btnToggleBasemap {
      position: fixed;
      top: 60px;
      right: 15px;
      z-index: 10000;
      background: rgba(15, 23, 42, 0.92);
      color: #38bdf8;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }
    #btnToggleBasemap:hover {
      background: #1e293b;
      border-color: #38bdf8;
    }

    /* INTRO SPLASH */
    #intro-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #040508;
      z-index: 999998;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .splash-logo-container {
      width: 120px;
      height: 120px;
      margin-bottom: 10px;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- 1. INTRO SPLASH SCREEN -->
  <div id="intro-splash">
    <div class="splash-logo-container">
      <img src="data/logo_overwatch.png" alt="Operation Overwatch" class="splash-logo">
    </div>
    <h2 class="glitch-title" data-text="OPERATION OVERWATCH">OPERATION <span>OVERWATCH</span></h2>
    <div class="loading-track">
      <div id="loading-bar"></div>
    </div>
    <div class="loading-status" id="status-text">INITIALIZING SECURE LINK...</div>
  </div>

  <!-- 2. HEADER UTAMA -->
  <header class="app-header">
    <div class="brand">
      <img src="data/logo_overwatch.png" alt="Logo" class="header-logo-img">
      <span>OVERWATCH ROAD INSPECTOR</span>
    </div>
    <nav class="tab-container">
      <button class="tab-btn active" onclick="switchTab('grade')">Grade</button>
      <button class="tab-btn" onclick="switchTab('lebar')">Lebar</button>
      <button class="tab-btn" onclick="switchTab('crossfall')">Crossfall</button>
    </nav>
  </header>

  <!-- 3. PETA, GPS, & TOMBOL TOGGLE SATELIT -->
  <div id="map"></div>
  <button class="gps-btn" onclick="locateUser()" title="Posisi Saya">📍</button>
  <button id="btnToggleBasemap" onclick="toggleBasemapSatelit()" title="Matikan / Hidupkan Satelit Luar">🌍 Satelit: <b>ON</b></button>

  <!-- 4. PANEL BAWAH -->
  <div id="bottom-panel" class="bottom-panel">
    <div class="panel-header">
      <div class="drag-handle"></div>
      <div class="panel-title" id="panel-title">Pilih Parameter / STA</div>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>

  <!-- 5. MODAL EXPORT PDF -->
  <div id="pdfModalOverlay" style="display:none; position:fixed; inset:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:99999; justify-content:center; align-items:center;">
    <div style="background:#0f172a; color:#fff; padding:20px; border-radius:8px; width:90%; max-width:350px; border:1px solid #1e293b; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
      <h3 style="margin-top:0; font-size:14px; color:#ff2b54; letter-spacing:1px; font-family:monospace;">EXPORT GRAFIK KE PDF</h3>
      <p style="font-size:11px; color:#94a3b8; margin-bottom:15px;">Pilih format layout cetak grafik memanjang:</p>
      
      <label style="display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:10px; cursor:pointer;">
        <input type="radio" name="pdfExportOpt" value="single" checked style="accent-color:#b81432;">
        <span><b>Opsi 1:</b> Utuh 1 Lembar (Landscape Panjang)</span>
      </label>
      
      <label style="display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:20px; cursor:pointer;">
        <input type="radio" name="pdfExportOpt" value="paging" style="accent-color:#b81432;">
        <span><b>Opsi 2:</b> Dipecah Per Section (Multi-Page Renggang)</span>
      </label>
      
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closePdfModal()" style="background:#1e293b; color:#cbd5e1; border:none; padding:6px 12px; border-radius:4px; font-size:11px; cursor:pointer;">Batal</button>
        <button onclick="executeExportPDF()" style="background:#b81432; color:#fff; border:none; padding:6px 14px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer;">Download</button>
      </div>
    </div>
  </div>

  <!-- Script logic WebGIS -->
  <script src="app.js"></script>
</body>
</html>
